name: Validate public terminology resource
on: [push, pull_request]
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python validate_public_release.py
      - run: python build_public_mapping_release.py && git diff --exit-code
